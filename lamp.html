<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamp Login Page</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0f172a;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 80%;
  }

  /* Lamp structure */
  .lamp {
    position: relative;
    width: 150px;
    height: 300px;
    cursor: pointer;
  }

  .lamp-shade {
    width: 120px;
    height: 100px;
    background: linear-gradient(145deg, #9bc5c3, #616161);
    border-radius: 80px 80px 20px 20px;
    position: absolute;
    top: 0;
    left: 15px;
    box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #333;
  }

  .lamp-face {
    position: absolute;
    top: 35%;
    left: 35%;
    font-size: 24px;
  }

  .lamp-stand {
    width: 15px;
    height: 130px;
    background-color: #d9d9d9;
    position: absolute;
    top: 100px;
    left: 68px;
  }

  .lamp-base {
    width: 80px;
    height: 20px;
    background-color: #bfbfbf;
    position: absolute;
    top: 230px;
    left: 35px;
    border-radius: 10px;
  }

  .string {
    position: absolute;
    width: 5px;
    height: 60px;
    background: #ccc;
    top: 90px;
    left: 120px;
    border-radius: 3px;
  }

  .light {
    position: absolute;
    top: 100px;
    left: 20px;
    width: 110px;
    height: 160px;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,200,0.8), rgba(255,255,200,0.1) 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    filter: blur(8px);
  }

  .lamp.on .light {
    opacity: 1;
  }

  /* Login box */
  .login-box {
    background-color: #1e293b;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,255,100,0.3);
    width: 300px;
    display: none;
    transition: box-shadow 0.3s ease;
  }

  .lamp.on ~ .login-box {
    display: block;
    animation: fadeIn 0.7s ease;
    box-shadow: 0 0 40px rgba(0,255,100,0.6);
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  .login-box h2 {
    color: #fff;
    text-align: center;
    margin-bottom: 25px;
  }

  .login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
    background: #334155;
    color: #fff;
  }

  .login-box button {
    width: 100%;
    padding: 10px;
    border: none;
    background: #22c55e;
    color: white;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .login-box button:hover {
    background: #16a34a;
  }

  .login-box a {
    display: block;
    text-align: center;
    color: #9ca3af;
    margin-top: 10px;
    font-size: 14px;
    text-decoration: none;
  }

  .login-box a:hover {
    color: #22c55e;
  }
</style>
</head>
<body>

<div class="container">
  <div class="lamp" id="lamp">
    <div class="lamp-shade">😊</div>
    <div class="light"></div>
    <div class="lamp-stand"></div>
    <div class="lamp-base"></div>
    <div class="string"></div>
  </div>

  <div class="login-box" id="loginBox">
    <h2>Welcome Back</h2>
    <input type="text" placeholder="Enter your username">
    <input type="password" placeholder="Enter your password">
    <button>Login</button>
    <a href="#">Forgot Password?</a>
  </div>
</div>

<script>
  const lamp = document.getElementById('lamp');

  lamp.addEventListener('click', () => {
    lamp.classList.toggle('on');
  });
</script>

</body>
</html>
